<style>
  :root {
    --orange: #FF6B35;
    --court: #C8A96E;
    --ink: #0D0D0D;
    --off-white: #F5F2ED;
    --muted: #777;
    --card-bg: #161616;
    --border: #252525;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--off-white); font-family:'DM Sans',sans-serif; min-height:100vh; }

  header {
    position:sticky; top:0; z-index:100;
    background:rgba(13,13,13,0.94); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem; height:58px;
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:0.12em; color:var(--off-white); text-decoration:none; }
  .logo span { color:var(--orange); }
  .back-btn {
    display:flex; align-items:center; gap:0.5rem;
    color:var(--muted); font-size:0.8rem; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    text-decoration:none; transition:color 0.15s;
    background:none; border:none; cursor:pointer;
  }
  .back-btn:hover { color:var(--off-white); }

  .container { max-width:900px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }

  .player-hero {
    display:flex; align-items:flex-end; gap:2rem;
    padding:2rem 2rem 0; margin-bottom:2rem;
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:16px; overflow:hidden; position:relative;
  }
  .player-hero-bg { position:absolute; inset:0; opacity:0.07; background:var(--player-color, var(--orange)); }
  .player-photo {
    width:140px; height:140px; border-radius:12px;
    object-fit:cover; object-position:top center;
    border:2px solid var(--border); flex-shrink:0; background:#1A1A1A;
    position:relative; z-index:1;
  }
  .player-info { padding-bottom:1.75rem; flex:1; position:relative; z-index:1; }
  .player-name { font-family:'Bebas Neue',sans-serif; font-size:2.8rem; letter-spacing:0.04em; line-height:1; color:var(--off-white); margin-bottom:0.5rem; }
  .player-meta { display:flex; gap:0.75rem; flex-wrap:wrap; }
  .player-tag { font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); background:#1E1E1E; border:1px solid var(--border); padding:3px 10px; border-radius:20px; }
  .player-tag.team-tag { color:var(--player-color, var(--orange)); border-color:var(--player-color, var(--orange)); }

  .section-label { font-family:'Bebas Neue',sans-serif; font-size:0.8rem; letter-spacing:0.22em; color:var(--orange); text-transform:uppercase; display:flex; align-items:center; gap:0.8rem; margin-bottom:1rem; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px; margin-bottom:2rem; }
  .stat-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:0.9rem 0.75rem; text-align:center; transition:border-color 0.15s; }
  .stat-card:hover { border-color:#3A3A3A; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:0.02em; color:var(--off-white); line-height:1; margin-bottom:0.3rem; }
  .stat-val.highlight { color:var(--orange); }
  .stat-label { font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }

  .seasons-table-wrap { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; overflow:hidden; overflow-x:auto; }
  .seasons-table { width:100%; border-collapse:collapse; font-size:0.85rem; min-width:600px; }
  .seasons-table th { padding:0.5rem 0.75rem; font-size:0.65rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); text-align:center; background:#141414; }
  .seasons-table th:first-child { text-align:left; }
  .seasons-table td { padding:0.65rem 0.75rem; border-bottom:1px solid #181818; text-align:center; color:#C0B8B0; }
  .seasons-table td:first-child { text-align:left; font-weight:600; color:var(--off-white); }
  .seasons-table tr:last-child td { border-bottom:none; }
  .seasons-table tr:hover td { background:#1A1A1A; }
  .seasons-table td.pts { color:var(--orange); font-family:'Bebas Neue',sans-serif; font-size:1rem; }
  .no-data { color:var(--muted); font-style:italic; }
</style>
</head>

  document.getElementById("content").innerHTML = `
    <div class="player-hero" style="--player-color:${p.color}">
      <div class="player-hero-bg"></div>
      <img class="player-photo" src="photos/${id}.jpg" alt="${p.name}"
           onerror="this.src='${p.photo}';this.onerror=null;">
      <div class="player-info">
        <div class="player-name">${p.name}</div>
        <div class="player-meta">
          <span class="player-tag team-tag">${p.team}</span>
          <span class="player-tag">${p.pos}</span>
          <span class="player-tag">${cur.gp} GP · 2025–26</span>
        </div>
      </div>
    </div>

    <div class="section-label">2025–26 Season Averages</div>
    <div class="stat-grid">${statCards}</div>

    <div class="section-label">Season by Season</div>
    <div class="seasons-table-wrap">
      <table class="seasons-table">
        <thead><tr><th>Season</th>${tableHeaders}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

render();
</script>
</body>
</html>
