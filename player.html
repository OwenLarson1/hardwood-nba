<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Stats — HARDWOOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B35;
    --court: #C8A96E;
    --ink: #0D0D0D;
    --off-white: #F5F2ED;
    --muted: #777;
    --card-bg: #161616;
    --border: #252525;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--off-white); font-family:'DM Sans',sans-serif; min-height:100vh; }

  header {
    position:sticky; top:0; z-index:100;
    background:rgba(13,13,13,0.94); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem; height:58px;
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:0.12em; color:var(--off-white); text-decoration:none; }
  .logo span { color:var(--orange); }
  .back-btn {
    display:flex; align-items:center; gap:0.5rem;
    color:var(--muted); font-size:0.8rem; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    text-decoration:none; transition:color 0.15s;
    background:none; border:none; cursor:pointer;
  }
  .back-btn:hover { color:var(--off-white); }

  .container { max-width:900px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }

  /* PLAYER HERO */
  .player-hero {
    display:flex; align-items:flex-end; gap:2rem;
    padding:2rem 2rem 0; margin-bottom:2rem;
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:16px; overflow:hidden; position:relative;
  }
  .player-hero-bg {
    position:absolute; inset:0; opacity:0.07;
    background:var(--player-color, var(--orange));
  }
  .player-photo {
    width:120px; height:120px; border-radius:12px;
    object-fit:cover; object-position:top;
    border:2px solid var(--border); flex-shrink:0;
    background:#1A1A1A;
  }
  .player-info { padding-bottom:1.5rem; flex:1; }
  .player-name {
    font-family:'Bebas Neue',sans-serif;
    font-size:2.8rem; letter-spacing:0.04em; line-height:1;
    color:var(--off-white); margin-bottom:0.4rem;
  }
  .player-meta { display:flex; gap:1rem; flex-wrap:wrap; }
  .player-tag {
    font-size:0.72rem; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted);
    background:#1E1E1E; border:1px solid var(--border);
    padding:3px 10px; border-radius:20px;
  }
  .player-tag.team-tag { color:var(--player-color, var(--orange)); border-color:var(--player-color, var(--orange)); }

  /* SEASON STAT CARDS */
  .season-block { margin-bottom:2rem; }
  .season-title {
    font-family:'Bebas Neue',sans-serif; font-size:0.85rem;
    letter-spacing:0.2em; color:var(--orange); text-transform:uppercase;
    display:flex; align-items:center; gap:0.8rem; margin-bottom:1rem;
  }
  .season-title::after { content:''; flex:1; height:1px; background:var(--border); }

  .stat-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:10px; margin-bottom:1.5rem;
  }
  .stat-card {
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:10px; padding:0.9rem 0.75rem; text-align:center;
    transition:border-color 0.15s;
  }
  .stat-card:hover { border-color:#3A3A3A; }
  .stat-val {
    font-family:'Bebas Neue',sans-serif; font-size:1.9rem;
    letter-spacing:0.02em; color:var(--off-white); line-height:1;
    margin-bottom:0.3rem;
  }
  .stat-val.highlight { color:var(--orange); }
  .stat-label { font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }

  /* MULTI-SEASON TABLE */
  .seasons-table-wrap {
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:14px; overflow:hidden;
  }
  .seasons-table-head {
    background:#1A1A1A; padding:0.7rem 1rem;
    font-family:'Bebas Neue',sans-serif; font-size:0.9rem;
    letter-spacing:0.12em; color:var(--off-white);
    border-bottom:1px solid var(--border);
  }
  .seasons-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  .seasons-table th {
    padding:0.5rem 0.75rem; font-size:0.65rem; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--border); text-align:center;
    background:#141414;
  }
  .seasons-table th:first-child { text-align:left; }
  .seasons-table td {
    padding:0.65rem 0.75rem; border-bottom:1px solid #181818;
    text-align:center; color:#C0B8B0;
  }
  .seasons-table td:first-child { text-align:left; font-weight:600; color:var(--off-white); }
  .seasons-table tr:last-child td { border-bottom:none; }
  .seasons-table tr:hover td { background:#1A1A1A; }
  .seasons-table td.pts { color:var(--orange); font-family:'Bebas Neue',sans-serif; font-size:1rem; }

  /* LOADING / ERROR */
  .state-msg {
    text-align:center; padding:4rem 2rem;
    color:var(--muted); font-size:0.9rem;
  }
  .spinner {
    width:32px; height:32px; border:3px solid var(--border);
    border-top-color:var(--orange); border-radius:50%;
    animation:spin 0.8s linear infinite; margin:0 auto 1rem;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">HARD<span>WOOD</span></a>
  <button class="back-btn" onclick="history.back()">← Back to Article</button>
</header>

<div class="container">
  <div id="content">
    <div class="state-msg"><div class="spinner"></div>Loading player stats...</div>
  </div>
</div>

<script>
// ── PLAYER ROSTER ─────────────────────────────────────────────────────────
// Maps URL id → { name, bdlName, team, teamColor, position, photoId }
const PLAYERS = {
  wembanyama: { name:"Victor Wembanyama", search:"Wembanyama", team:"San Antonio Spurs", color:"#8A8A8A", pos:"C", photoId:1641706 },
  edwards:    { name:"Anthony Edwards",   search:"Edwards",     team:"Minnesota Timberwolves", color:"#005083", pos:"SG", photoId:1630162 },
  randle:     { name:"Julius Randle",     search:"Randle",      team:"Minnesota Timberwolves", color:"#005083", pos:"PF", photoId:203994 },
  dosunmu:    { name:"Ayo Dosunmu",       search:"Dosunmu",     team:"Minnesota Timberwolves", color:"#005083", pos:"SG", photoId:1630245 },
  harper:     { name:"Dylan Harper",      search:"Harper",      team:"San Antonio Spurs", color:"#8A8A8A", pos:"SG", photoId:1642355 },
  fox:        { name:"De'Aaron Fox",      search:"Fox",         team:"San Antonio Spurs", color:"#8A8A8A", pos:"PG", photoId:1628368 },
  cunningham: { name:"Cade Cunningham",   search:"Cunningham",  team:"Detroit Pistons", color:"#1F3A6E", pos:"PG", photoId:1630595 },
  duren:      { name:"Jalen Duren",       search:"Duren",       team:"Detroit Pistons", color:"#1F3A6E", pos:"C", photoId:1631105 },
  reed:       { name:"Paul Reed",         search:"Reed",        team:"Detroit Pistons", color:"#1F3A6E", pos:"PF", photoId:1630194 },
  levert:     { name:"Caris LeVert",      search:"LeVert",      team:"Cleveland Cavaliers", color:"#6F263D", pos:"SG", photoId:1627747 },
  jenkins:    { name:"Daniss Jenkins",    search:"Jenkins",     team:"Detroit Pistons", color:"#1F3A6E", pos:"PG", photoId:1641731 },
  athompson:  { name:"Ausar Thompson",    search:"Ausar",       team:"Detroit Pistons", color:"#1F3A6E", pos:"SF", photoId:1641706 },
};

const SEASONS = [
  { label:"2025–26", bdl:"2025" },
  { label:"2024–25", bdl:"2024" },
  { label:"2023–24", bdl:"2023" },
  { label:"2022–23", bdl:"2022" },
];

const STAT_KEYS = [
  { key:"pts",    label:"PPG",   highlight:true },
  { key:"reb",    label:"RPG" },
  { key:"ast",    label:"APG" },
  { key:"stl",    label:"SPG" },
  { key:"blk",    label:"BPG" },
  { key:"min",    label:"MIN" },
  { key:"turnover", label:"TOV" },
  { key:"fg_pct", label:"FG%",  pct:true },
  { key:"fg3_pct",label:"3P%",  pct:true },
  { key:"ft_pct", label:"FT%",  pct:true },
  { key:"plus_minus_100_poss", label:"+/-" },
];

function fmt(val, isPct) {
  if (val === null || val === undefined) return "—";
  if (isPct) return (val * 100).toFixed(1) + "%";
  if (typeof val === "number") return val % 1 === 0 ? val : val.toFixed(1);
  return val;
}

async function fetchStats(playerName, season) {
  try {
    const search = encodeURIComponent(playerName);
    const res = await fetch(`https://api.balldontlie.io/v1/season_averages?season=${season}&player_id=${await getPlayerId(playerName)}`);
    const data = await res.json();
    return data.data?.[0] || null;
  } catch { return null; }
}

async function getPlayerId(name) {
  const parts = name.trim().split(" ");
  const last = parts[parts.length - 1];
  const res = await fetch(`https://api.balldontlie.io/v1/players?search=${encodeURIComponent(last)}&per_page=25`);
  const data = await res.json();
  const match = data.data?.find(p =>
    `${p.first_name} ${p.last_name}`.toLowerCase().includes(name.toLowerCase().split(" ").slice(-1)[0].toLowerCase())
  );
  return match?.id || null;
}

async function loadPlayer() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const player = PLAYERS[id];

  if (!player) {
    document.getElementById("content").innerHTML = `<div class="state-msg">Player not found.</div>`;
    return;
  }

  document.title = `${player.name} — HARDWOOD`;

  // First get the player ID from the API
  let bdlId = null;
  try {
    const parts = player.search.trim().split(" ");
    const searchTerm = parts[parts.length - 1];
    const res = await fetch(`https://api.balldontlie.io/v1/players?search=${encodeURIComponent(searchTerm)}&per_page=25`);
    const data = await res.json();
    const match = data.data?.find(p => {
      const full = `${p.first_name} ${p.last_name}`.toLowerCase();
      return full.includes(player.search.toLowerCase().split(" ").slice(-1)[0].toLowerCase());
    });
    bdlId = match?.id || null;
  } catch {}

  // Fetch all seasons
  const seasonStats = [];
  if (bdlId) {
    for (const s of SEASONS) {
      try {
        const res = await fetch(`https://api.balldontlie.io/v1/season_averages?season=${s.bdl}&player_ids[]=${bdlId}`);
        const data = await res.json();
        const row = data.data?.[0] || null;
        seasonStats.push({ label: s.label, stats: row });
      } catch {
        seasonStats.push({ label: s.label, stats: null });
      }
    }
  }

  const current = seasonStats[0]?.stats;
  const photoUrl = `photos/${id}.jpg`;

  // Build hero stat cards for current season
  const statCards = STAT_KEYS.map(s => {
    const val = current ? fmt(current[s.key], s.pct) : "—";
    return `<div class="stat-card">
      <div class="stat-val ${s.highlight ? 'highlight' : ''}">${val}</div>
      <div class="stat-label">${s.label}</div>
    </div>`;
  }).join("");

  // Build multi-season table
  const tableRows = seasonStats.map(s => {
    if (!s.stats) return `<tr><td>${s.label}</td>${STAT_KEYS.map(k => `<td>—</td>`).join("")}</tr>`;
    return `<tr>
      <td>${s.label}</td>
      ${STAT_KEYS.map(k => `<td class="${k.highlight ? 'pts' : ''}">${fmt(s.stats[k.key], k.pct)}</td>`).join("")}
    </tr>`;
  }).join("");

  const tableHeaders = STAT_KEYS.map(k => `<th>${k.label}</th>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="player-hero" style="--player-color:${player.color}">
      <div class="player-hero-bg"></div>
      <img class="player-photo" src="${photoUrl}" alt="${player.name}" onerror="this.src='https://cdn.nba.com/headshots/nba/latest/1040x760/${player.photoId}.png'">
      <div class="player-info">
        <div class="player-name">${player.name}</div>
        <div class="player-meta">
          <span class="player-tag team-tag">${player.team}</span>
          <span class="player-tag">${player.pos}</span>
          ${current ? `<span class="player-tag">${current.games_played} GP · ${seasonStats[0].label}</span>` : ""}
        </div>
      </div>
    </div>

    <div class="season-block">
      <div class="season-title">2025–26 Season Averages</div>
      ${current ? `<div class="stat-grid">${statCards}</div>` : `<div class="state-msg" style="padding:2rem;">No stats available for this season yet.</div>`}
    </div>

    <div class="season-block">
      <div class="season-title">Season by Season</div>
      <div class="seasons-table-wrap">
        <table class="seasons-table">
          <thead><tr><th>Season</th>${tableHeaders}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;
}

loadPlayer();
</script>
</body>
</html>
