<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Stats — HARDWOOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B35;
    --court: #C8A96E;
    --ink: #0D0D0D;
    --off-white: #F5F2ED;
    --muted: #777;
    --card-bg: #161616;
    --border: #252525;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--off-white); font-family:'DM Sans',sans-serif; min-height:100vh; }

  header {
    position:sticky; top:0; z-index:100;
    background:rgba(13,13,13,0.94); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.5rem; height:58px;
  }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:0.12em; color:var(--off-white); text-decoration:none; }
  .logo span { color:var(--orange); }
  .back-btn { display:flex; align-items:center; gap:0.5rem; color:var(--muted); font-size:0.8rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; text-decoration:none; transition:color 0.15s; background:none; border:none; cursor:pointer; }
  .back-btn:hover { color:var(--off-white); }

  .container { max-width:900px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }

  .team-hero { padding:2rem; margin-bottom:2rem; background:var(--card-bg); border:1px solid var(--border); border-radius:16px; position:relative; overflow:hidden; }
  .team-hero-accent { position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--team-color, var(--orange)); }
  .team-hero-glow { position:absolute; inset:0; opacity:0.05; background:var(--team-color, var(--orange)); }
  .team-name { font-family:'Bebas Neue',sans-serif; font-size:3rem; letter-spacing:0.04em; line-height:1; color:var(--off-white); margin-bottom:0.5rem; position:relative; }
  .team-conf { font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); position:relative; }
  .team-conf span { color:var(--team-color, var(--orange)); }

  .section-label { font-family:'Bebas Neue',sans-serif; font-size:0.8rem; letter-spacing:0.22em; color:var(--orange); text-transform:uppercase; display:flex; align-items:center; gap:0.8rem; margin-bottom:1rem; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-bottom:2rem; }
  .stat-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:0.9rem 0.75rem; text-align:center; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:0.02em; color:var(--off-white); line-height:1; margin-bottom:0.3rem; }
  .stat-val.orange { color:var(--orange); }
  .stat-label { font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }

  .roster-wrap { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; overflow:hidden; overflow-x:auto; }
  .roster-table { width:100%; border-collapse:collapse; font-size:0.85rem; min-width:580px; }
  .roster-table th { padding:0.5rem 0.75rem; font-size:0.65rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); text-align:center; background:#141414; }
  .roster-table th:first-child { text-align:left; }
  .roster-table td { padding:0.65rem 0.75rem; border-bottom:1px solid #181818; text-align:center; color:#C0B8B0; }
  .roster-table td:first-child { text-align:left; font-weight:600; color:var(--off-white); }
  .roster-table tr:last-child td { border-bottom:none; }
  .roster-table tr:hover td { background:#1A1A1A; }
  .roster-table td.pts { color:var(--orange); font-family:'Bebas Neue',sans-serif; font-size:1rem; }
  .player-link { color:var(--off-white); text-decoration:none; border-bottom:1px solid #333; transition:border-color 0.15s, color 0.15s; }
  .player-link:hover { border-bottom-color:var(--court); color:var(--court); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">HARD<span>WOOD</span></a>
  <button class="back-btn" onclick="history.back()">← Back to Article</button>
</header>

<div class="container" id="content">
  <p style="color:var(--muted);text-align:center;padding:4rem;">Loading...</p>
</div>

<script>
const TEAMS = {
  spurs: {
    name:"San Antonio Spurs", abbr:"SAS", color:"#8A8A8A", conf:"Western Conference",
    record:"62-20", ppg:"118.4", oppg:"108.1", pace:"99.2", netRtg:"+8.6", winPct:".756",
    players: [
      { name:"Victor Wembanyama", pid:"wembanyama", gp:68, pts:26.1, reb:11.2, ast:4.1, stl:1.7, blk:3.8, fg:"47.8%", three:"36.2%" },
      { name:"De'Aaron Fox",      pid:"fox",         gp:74, pts:26.8, reb:4.4,  ast:7.9, stl:1.5, blk:0.4, fg:"48.9%", three:"35.4%" },
      { name:"Dylan Harper",      pid:"harper",      gp:70, pts:19.4, reb:4.2,  ast:5.8, stl:1.4, blk:0.4, fg:"48.3%", three:"36.8%" },
    ]
  },
  timberwolves: {
    name:"Minnesota Timberwolves", abbr:"MIN", color:"#005083", conf:"Western Conference",
    record:"49-33", ppg:"113.2", oppg:"110.8", pace:"97.4", netRtg:"+1.9", winPct:".598",
    players: [
      { name:"Anthony Edwards", pid:"edwards",  gp:71, pts:27.8, reb:5.7, ast:5.1, stl:1.3, blk:0.6, fg:"46.1%", three:"37.4%" },
      { name:"Julius Randle",   pid:"randle",   gp:64, pts:22.4, reb:9.1, ast:4.8, stl:0.9, blk:0.4, fg:"48.2%", three:"34.1%" },
      { name:"Ayo Dosunmu",     pid:"dosunmu",  gp:72, pts:14.2, reb:3.9, ast:4.8, stl:1.1, blk:0.3, fg:"47.1%", three:"38.9%" },
    ]
  },
  pistons: {
    name:"Detroit Pistons", abbr:"DET", color:"#1F3A6E", conf:"Eastern Conference",
    record:"60-22", ppg:"116.7", oppg:"109.3", pace:"98.8", netRtg:"+6.2", winPct:".732",
    players: [
      { name:"Cade Cunningham", pid:"cunningham", gp:76, pts:26.6, reb:6.1,  ast:9.2, stl:1.2, blk:0.5, fg:"46.2%", three:"37.1%" },
      { name:"Jalen Duren",     pid:"duren",      gp:68, pts:18.9, reb:11.4, ast:2.2, stl:0.8, blk:1.8, fg:"58.4%", three:"—" },
      { name:"Ausar Thompson",  pid:"athompson",  gp:72, pts:16.4, reb:7.2,  ast:3.1, stl:1.8, blk:0.9, fg:"51.2%", three:"34.8%" },
      { name:"Daniss Jenkins",  pid:"jenkins",    gp:52, pts:11.2, reb:2.8,  ast:3.4, stl:1.1, blk:0.2, fg:"44.8%", three:"39.2%" },
      { name:"Caris LeVert",    pid:"levert",     gp:61, pts:14.8, reb:3.2,  ast:4.1, stl:0.9, blk:0.3, fg:"45.1%", three:"38.2%" },
      { name:"Paul Reed",       pid:"reed",       gp:58, pts:9.4,  reb:7.1,  ast:1.4, stl:0.9, blk:1.2, fg:"52.1%", three:"33.4%" },
    ]
  },
  cavaliers: {
    name:"Cleveland Cavaliers", abbr:"CLE", color:"#6F263D", conf:"Eastern Conference",
    record:"52-30", ppg:"112.4", oppg:"107.6", pace:"96.8", netRtg:"+4.1", winPct:".634",
    players: [
      { name:"Donovan Mitchell",  pid:null, gp:68, pts:26.2, reb:4.4, ast:5.2, stl:1.6, blk:0.4, fg:"47.1%", three:"38.4%" },
      { name:"Darius Garland",    pid:null, gp:62, pts:20.1, reb:2.8, ast:7.8, stl:1.1, blk:0.2, fg:"44.8%", three:"37.2%" },
      { name:"Evan Mobley",       pid:null, gp:70, pts:18.4, reb:9.4, ast:3.1, stl:1.2, blk:2.1, fg:"55.2%", three:"32.1%" },
      { name:"Caris LeVert",      pid:"levert", gp:61, pts:14.8, reb:3.2, ast:4.1, stl:0.9, blk:0.3, fg:"45.1%", three:"38.2%" },
    ]
  },
  thunder: {
    name:"Oklahoma City Thunder", abbr:"OKC", color:"#007AC1", conf:"Western Conference",
    record:"64-18", ppg:"119.8", oppg:"106.4", pace:"100.1", netRtg:"+10.8", winPct:".780",
    players: [
      { name:"Shai Gilgeous-Alexander", pid:null, gp:74, pts:32.7, reb:5.5, ast:6.4, stl:2.2, blk:0.9, fg:"53.8%", three:"37.1%" },
      { name:"Chet Holmgren",           pid:null, gp:68, pts:19.2, reb:8.4, ast:2.8, stl:0.8, blk:2.8, fg:"50.4%", three:"38.8%" },
      { name:"Jalen Williams",          pid:null, gp:72, pts:22.4, reb:4.8, ast:5.2, stl:1.4, blk:0.6, fg:"48.9%", three:"36.4%" },
    ]
  },
};

function render() {
  const id = new URLSearchParams(window.location.search).get("id");
  const t = TEAMS[id];
  if (!t) { document.getElementById("content").innerHTML = `<p style="color:var(--muted);text-align:center;padding:4rem;">Team not found.</p>`; return; }

  document.title = `${t.name} — HARDWOOD`;

  const rows = t.players.map(p => {
    const nameCell = p.pid
      ? `<a href="player.html?id=${p.pid}" class="player-link">${p.name}</a>`
      : p.name;
    return `<tr>
      <td>${nameCell}</td>
      <td>${p.gp}</td>
      <td class="pts">${p.pts}</td>
      <td>${p.reb}</td>
      <td>${p.ast}</td>
      <td>${p.stl}</td>
      <td>${p.blk}</td>
      <td>${p.fg}</td>
      <td>${p.three}</td>
    </tr>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="team-hero" style="--team-color:${t.color}">
      <div class="team-hero-accent"></div>
      <div class="team-hero-glow"></div>
      <div class="team-name">${t.name}</div>
      <div class="team-conf">${t.conf} &nbsp;·&nbsp; <span>${t.abbr}</span></div>
    </div>

    <div class="section-label">2025–26 Team Stats</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-val orange">${t.record.split("-")[0]}</div><div class="stat-label">Wins</div></div>
      <div class="stat-card"><div class="stat-val">${t.record.split("-")[1]}</div><div class="stat-label">Losses</div></div>
      <div class="stat-card"><div class="stat-val orange">${t.winPct}</div><div class="stat-label">Win %</div></div>
      <div class="stat-card"><div class="stat-val orange">${t.ppg}</div><div class="stat-label">PPG</div></div>
      <div class="stat-card"><div class="stat-val">${t.oppg}</div><div class="stat-label">Opp PPG</div></div>
      <div class="stat-card"><div class="stat-val">${t.pace}</div><div class="stat-label">Pace</div></div>
      <div class="stat-card"><div class="stat-val orange">${t.netRtg}</div><div class="stat-label">Net Rtg</div></div>
    </div>

    <div class="section-label">Key Players — 2025–26 Averages</div>
    <div class="roster-wrap">
      <table class="roster-table">
        <thead><tr><th>Player</th><th>GP</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>FG%</th><th>3P%</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

render();
</script>
</body>
</html>
